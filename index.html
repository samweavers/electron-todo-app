<!DOCTYPE html>
<html>
  <head>
    <title>Tick</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <section class="todo-inputs">
      <h1>Start ticking your tasks</h1>
      <input type="text" id="taskTitleInput" placeholder="Give your task a title" />
      <input type="text" id="taskLinkInput" placeholder="Reference link (https://github.com/username/example/pulls)" />
      <textarea
        type="text"
        id="taskDescInput"
        placeholder="Describe your task.."></textarea>
      <button class="btn" onclick="addTask()">Add Task</button>
    </section>
    <article class="task-list" id="taskList"></article>
    <script src="renderer.js"></script>
  </body>
</html>
